services:
  - type: web
    name: smart-sms-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: student_management_db
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: APP_NAME
        value: Smart Student Management System
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: UPLOAD_DIR
        value: uploads
      - key: PYTHON_VERSION
        value: 3.11.9
